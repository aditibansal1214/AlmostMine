<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AlmostMine — Own less. Access more.</title>
    <meta name="description" content="Own less. Access more. Community item sharing and rental web app & PWA." />
    <meta property="og:title" content="AlmostMine — Own less. Access more." />
    <meta property="og:description" content="Own less. Access more. Community item sharing and rental web app & PWA." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web App meta tags -->
    <meta name="theme-color" content="#1F4D3A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AlmostMine" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Typography: Fraunces & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Theme initialization script (before first paint) -->
    <script>
      (function() {
        try {
          const stored = localStorage.getItem('almostmine_theme');
          const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          const storedContrast = localStorage.getItem('almostmine_high_contrast');
          if (storedContrast === 'true') {
            document.documentElement.classList.add('high-contrast');
          }
          const storedTextSize = localStorage.getItem('almostmine_text_size');
          if (storedTextSize) {
            document.documentElement.setAttribute('data-text-size', storedTextSize);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-am-bg text-am-ink antialiased selection:bg-am-sand selection:text-am-ink min-h-dvh">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
