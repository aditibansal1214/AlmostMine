<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - AlmostMine</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #FAF7F2;
      color: #1E2A24;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #E2DACB;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 16px rgba(30, 42, 36, 0.04);
    }
    .badge {
      display: inline-block;
      background: #F3EEE5;
      color: #1F4D3A;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 8px 0;
      font-weight: 600;
    }
    p {
      color: #5B665F;
      font-size: 15px;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    button {
      background: #1F4D3A;
      color: #FFFFFF;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      width: 100%;
    }
    button:active {
      background: #163A2B;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">AlmostMine</div>
    <h1>You are offline</h1>
    <p>Please check your internet connection to access community listings and requests.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
